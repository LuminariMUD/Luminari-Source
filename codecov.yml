coverage:
  precision: 2
  round: down
  range: 3.30..100
  status:
    project:
      default:
        # Ratchet against the base commit; gcovr enforces the fixed 3.30% floor.
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        target: auto
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
