# Pre-commit hooks for LuminariMUD
# See https://pre-commit.com for more information

repos:
  # clang-format for C/C++ formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: [--style=file]
        exclude: ^src/(olc/genolc\.c|utils\.h)$

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # help.hlp is generated data (hedit export). Rewriting its whitespace
      # would churn thousands of lines and diverge from what the exporter
      # emits, so the hygiene hooks skip it.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^lib/text/help/help\.hlp$
      - id: end-of-file-fixer
        exclude: ^lib/text/help/help\.hlp$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^lib/text/help/help\.hlp$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      # Build verification (pre-push only)
      - id: check-build
        name: Verify build compiles
        entry: bash -c 'make -j$(nproc) -q 2>/dev/null || echo "Build check skipped"'
        language: system
        pass_filenames: false
        stages: [pre-push]
