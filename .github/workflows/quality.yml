name: Code Quality

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "src/**"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/quality.yml"

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      # Runs the clang-format pinned in .pre-commit-config.yaml (v18.1.8) over
      # every tracked C/C++ file, honouring that file's exclude list. Using the
      # hook rather than the distro clang-format keeps CI, the local pre-commit
      # hook, and developers on one version: an unpinned `apt-get install
      # clang-format` silently changes formatting rules whenever the runner
      # image moves, and the previous `head -50` sample checked an arbitrary
      # subset of src/ that shifted with the directory listing.
      - name: Check formatting
        run: |
          pre-commit run clang-format --all-files --show-diff-on-failure || {
            echo "::error::Formatting issues found. Run 'pre-commit run clang-format --all-files' locally."
            exit 1
          }
