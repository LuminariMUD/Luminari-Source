name: Code Quality

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      # The php-cs-fixer and PSScriptAnalyzer hooks run the runner image's php
      # and pwsh. Printing both first makes an image change that drops either
      # one fail here instead of inside a hook.
      - name: Show formatter runtimes
        run: |
          php --version
          pwsh --version

      # Runs every hook pinned in .pre-commit-config.yaml over every tracked
      # file: the formatters for each file type, the hygiene hooks, and the SQL
      # format policy. Versions come from that file, so CI, the local hook, and
      # developers format identically; an unpinned distro formatter would
      # change the rules whenever the runner image moves.
      - name: Check formatting
        run: |
          pre-commit run --all-files --show-diff-on-failure || {
            echo "::error::Formatting issues found. Run 'pre-commit run --all-files' locally and commit the result."
            exit 1
          }

      # The policy also runs as a pre-commit hook; this step keeps it in CI even
      # if that hook entry is removed.
      - name: Check the SQL format policy
        run: |
          python3 scripts/ci/check_sql_format_policy.py --self-test
          python3 scripts/ci/check_sql_format_policy.py
