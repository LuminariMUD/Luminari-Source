name: Code Quality

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/quality.yml'

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      # Runs the clang-format pinned in .pre-commit-config.yaml (v18.1.8) over
      # every tracked C/C++ file, honouring that file's exclude list. Using the
      # hook rather than the distro clang-format keeps CI, the local pre-commit
      # hook, and developers on one version: an unpinned `apt-get install
      # clang-format` silently changes formatting rules whenever the runner
      # image moves, and the previous `head -50` sample checked an arbitrary
      # subset of src/ that shifted with the directory listing.
      - name: Check formatting
        run: |
          pre-commit run clang-format --all-files --show-diff-on-failure || {
            echo "::error::Formatting issues found. Run 'pre-commit run clang-format --all-files' locally."
            exit 1
          }

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libmariadb-dev libssl-dev zlib1g-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Run clang-tidy on changed files
        run: |
          # Run on a subset of core files to start
          clang-tidy src/utils.c src/handler.c src/comm.c \
            --checks='-*,bugprone-*,cert-*,-cert-err33-c' \
            --warnings-as-errors='' \
            -- -I/usr/include/mariadb -Isrc 2>&1 | head -100 || true

  compile-check:
    name: Compile with Warnings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev libssl-dev zlib1g-dev \
            autoconf automake libtool libevent-dev libgd-dev libcurl4-openssl-dev libjson-c-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Configure with autotools
        run: |
          autoreconf -fvi
          ./configure

      - name: Build with strict warnings
        run: |
          make -j"$(nproc)" CFLAGS="-Wall -Wextra -Wno-unused-parameter -Wno-sign-compare" 2>&1 | tee build.log
          # Report warning count but don't fail (legacy codebase)
          WARN_COUNT=$(grep -c ": warning:" build.log || echo 0)
          echo "::notice::Compiler warnings: $WARN_COUNT"
