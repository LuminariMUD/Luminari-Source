name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'sql/**'
      - 'lib/world/**'
      - 'scripts/**'
      - '.github/workflows/integration.yml'

jobs:
  database-migration:
    name: Database Migration Dry-Run
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari
          MARIADB_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u luminari -ptestpass --silent 2>/dev/null; then
              echo "MariaDB is ready"
              break
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done
          mysqladmin ping -h 127.0.0.1 -u luminari -ptestpass --silent

      - name: Validate master schema
        run: |
          test -f sql/master_schema.sql || {
            echo "::error::Required sql/master_schema.sql is missing"
            exit 1
          }
          echo "Applying master_schema.sql..."
          mysql -h 127.0.0.1 -u luminari -ptestpass luminari_test < sql/master_schema.sql
          echo "Master schema applied successfully"

      - name: Validate component schemas
        run: |
          manifest=sql/components/ci_schema_manifest.txt
          actual_schemas=/tmp/luminari-actual-schemas.txt
          listed_schemas=/tmp/luminari-listed-schemas.txt
          failed=0

          test -f "$manifest" || {
            echo "::error::Required component schema manifest is missing"
            exit 1
          }

          find sql/components -maxdepth 1 -type f -name '*.sql' -printf '%f\n' |
            sort > "$actual_schemas"
          awk '$1 == "apply" || $1 == "skip" { print $2 }' "$manifest" |
            sort > "$listed_schemas"
          if ! diff -u "$actual_schemas" "$listed_schemas"; then
            echo "::error::Every component SQL file must be classified exactly once"
            exit 1
          fi

          while read -r action schema_name; do
            [[ -z "${action:-}" || "$action" == \#* ]] && continue
            schema="sql/components/$schema_name"

            if [[ "$action" == "skip" ]]; then
              echo "Explicitly excluded from schema application: $schema"
              continue
            fi
            if [[ "$action" != "apply" ]]; then
              echo "::error::Unknown schema manifest action '$action'"
              exit 1
            fi

            echo "Validating on a fresh master schema: $schema"
            mysql -h 127.0.0.1 -u root -ptestroot -e "
              DROP DATABASE IF EXISTS luminari_component_test;
              CREATE DATABASE luminari_component_test CHARACTER SET utf8mb4;
            "
            mysql -h 127.0.0.1 -u root -ptestroot \
              luminari_component_test < sql/master_schema.sql
            if mysql -h 127.0.0.1 -u root -ptestroot \
              luminari_component_test < "$schema"; then
              echo "  OK: $schema"
            else
              echo "::error::Schema application failed: $schema"
              failed=1
            fi
          done < "$manifest"

          [[ "$failed" -eq 0 ]] || exit 1
          echo "All current component schemas applied successfully"

      - name: Verify database structure
        run: |
          echo "Tables created:"
          mysql -h 127.0.0.1 -u luminari -ptestpass luminari_test -e "SHOW TABLES;" | head -50
          TABLE_COUNT=$(mysql -h 127.0.0.1 -u luminari -ptestpass luminari_test -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='luminari_test';")
          echo "Total tables: $TABLE_COUNT"
          if [[ "$TABLE_COUNT" -gt 0 ]]; then
            echo "Database migration dry-run successful"
          else
            echo "::error::No tables were created by master_schema.sql"
            exit 1
          fi

  world-validation:
    name: World File Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify minimal world files exist
        run: |
          echo "Checking minimal world directory..."
          if [[ -d lib/world/minimal ]]; then
            echo "Minimal world files found:"
            ls -la lib/world/minimal/
          else
            echo "::error::Minimal world directory not found at lib/world/minimal/"
            exit 1
          fi

      - name: Validate world file structure
        run: |
          ERRORS=0

          # Check for required index files
          for dir in zon wld mob obj shp trg qst hlq; do
            if [[ -f "lib/world/minimal/index.${dir}" ]]; then
              echo "Found: index.${dir}"
            else
              echo "::error::Missing required index file: index.${dir}"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Check zone files are parseable (basic syntax check)
          echo "Validating zone file syntax..."
          shopt -s nullglob
          zonefiles=(lib/world/minimal/*.zon)
          if [[ "${#zonefiles[@]}" -eq 0 ]]; then
            echo "::error::No minimal zone file was found"
            ERRORS=$((ERRORS + 1))
          fi
          for zonefile in "${zonefiles[@]}"; do
            # Basic check: zone files should start with zone number or comment
            if head -5 "$zonefile" | grep -qE '^[0-9#]'; then
              echo "  OK: $zonefile"
            else
              echo "::error::Zone syntax check failed: $zonefile"
              ERRORS=$((ERRORS + 1))
            fi
          done

          [[ "$ERRORS" -eq 0 ]] || exit 1
          echo "World file validation complete"

      - name: Check world directory structure
        run: |
          echo "=== World Directory Structure ==="
          for dir in zon wld mob obj shp trg qst hlq; do
            if [[ -d "lib/world/$dir" ]]; then
              count=$(find "lib/world/$dir" -type f 2>/dev/null | wc -l)
              echo "$dir: $count files"
            else
              echo "$dir: directory missing"
            fi
          done

  server-startup:
    name: Server Startup Verification
    runs-on: ubuntu-latest
    needs: [database-migration, world-validation]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari
          MARIADB_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      LUMINARI_TEST_MYSQL_ENABLE: '1'
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari
      LUMINARI_TEST_MYSQL_PASSWORD: testpass
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: '3306'
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev libssl-dev zlib1g-dev \
            autoconf automake libtool libgd-dev libcurl4-openssl-dev libjson-c-dev \
            mariadb-client netcat-openbsd

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Build server
        run: |
          autoreconf -fvi
          ./configure
          make -j"$(nproc)"
          test -f circle && echo "Build successful: circle binary created"

      - name: Prepare isolated integration runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Server startup smoke test
        run: |
          set -euo pipefail
          echo "Starting server for smoke test..."
          server_log="$RUNNER_TEMP/luminari-integration-syslog"

          # The minimal fixture intentionally omits production special-procedure
          # targets, so suppress special assignment while testing the real boot.
          ./circle -f "$LUMINARI_TEST_CONFIG_FILE" -d "$LUMINARI_TEST_DATA_DIR" \
            -o "$server_log" -q -s 4100 &
          server_pid=$!
          cleanup_server()
          {
            kill "$server_pid" 2>/dev/null || true
            for _attempt in {1..10}; do
              kill -0 "$server_pid" 2>/dev/null || break
              sleep 0.2
            done
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT

          listening=0
          for _attempt in {1..20}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            if nc -z localhost 4100 2>/dev/null; then
              listening=1
              break
            fi
            sleep 1
          done

          if [[ "$listening" -ne 1 ]]; then
            echo "::error::Server did not accept connections on port 4100"
            [[ -f "$server_log" ]] && tail -100 "$server_log"
            exit 1
          fi

          echo "Server is accepting connections on port 4100"
          test -f "$server_log" || {
            echo "::error::Server log was not created"
            exit 1
          }

          echo "=== Recent server log entries ==="
          tail -40 "$server_log"
          if grep -qi "SYSERR" "$server_log"; then
            echo "::error::Unexpected SYSERR found during startup"
            grep -in "SYSERR" "$server_log"
            exit 1
          fi

          echo "Server startup smoke test PASSED"
