name: Build & Test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "unittests/**"
      - "scripts/world/**"
      - "scripts/ci/**"
      - "scripts/deployment/**"
      - "scripts/operations/**"
      - "scripts/development/generate-web-guides.sh"
      - "scripts/events/**"
      - "lib/world/validate-zone.sh"
      - "lib/world/artifacts/**"
      - "lib/world/minimal/**"
      - "docs/world_game-data/**"
      - "docs/world/STARTER_AREA.md"
      - "docs/systems/OLC_ONLINE_CREATION_SYSTEM.md"
      - "docs/guides/OLC_SpecProcs.md"
      - "docs/guides/TESTING_GUIDE.md"
      - "docs/utilities/**"
      - "docs/TECHNICAL_DOCUMENTATION_MASTER_INDEX.md"
      - "docs/web/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "configure.ac"
      - "Makefile.am"
      - "util/Makefile.am"
      - ".gitignore"
      - "scripts/ci/check_source_hygiene.py"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-build/**"
      - "scripts/autorun/**"
      - "scripts/process-memory/**"
      - "sql/**"
      - "lib/world/**"
  pull_request:
    branches: [master, main]
    paths:
      - "src/**"
      - "unittests/**"
      - "scripts/world/**"
      - "scripts/ci/**"
      - "scripts/deployment/**"
      - "scripts/operations/**"
      - "scripts/development/generate-web-guides.sh"
      - "scripts/events/**"
      - "lib/world/validate-zone.sh"
      - "lib/world/artifacts/**"
      - "lib/world/minimal/**"
      - "docs/world_game-data/**"
      - "docs/world/STARTER_AREA.md"
      - "docs/systems/OLC_ONLINE_CREATION_SYSTEM.md"
      - "docs/guides/OLC_SpecProcs.md"
      - "docs/guides/TESTING_GUIDE.md"
      - "docs/utilities/**"
      - "docs/TECHNICAL_DOCUMENTATION_MASTER_INDEX.md"
      - "docs/web/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "configure.ac"
      - "Makefile.am"
      - "util/Makefile.am"
      - ".gitignore"
      - "scripts/ci/check_source_hygiene.py"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-build/**"
      - "scripts/autorun/**"
      - "scripts/process-memory/**"
      - "sql/**"
      - "lib/world/**"

permissions:
  contents: read

env:
  LUMINARI_TEST_SPEC_WORLD_ROOT: ${{ github.workspace }}/unittests/CuTest/fixtures/spec_world_inventory

jobs:
  world-tools:
    name: World-data tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libevent-dev pandoc

      - name: Build mobile conversion calculator
        run: |
          cp src/config/campaign.example.h src/config/campaign.h
          cp src/config/mud_options.example.h src/config/mud_options.h
          cp src/config/vnums.example.h src/config/vnums.h
          autoreconf -fvi
          ./configure
          make -C util rol_mob_calculator

      - name: Run world-data tool tests
        run: python -m unittest discover -s scripts/world/tests -t scripts/world -v

      - name: Check extracted constants
        run: python scripts/world/wtool.py constants sync --check

      - name: Check world-building documentation
        run: python scripts/world/wtool.py docs --check

      - name: Smoke test compatibility wrapper
        run: |
          lib/world/validate-zone.sh 100 \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            --json >/dev/null

      - name: Smoke test quest-system lookup
        run: |
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            show quest 10000 >/dev/null
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            refs quest 10000 >/dev/null
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            show hlquest 10000 >/dev/null
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            refs hlquest 10000 >/dev/null

  build-parity:
    name: Autotools/CMake manifest parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that Makefile.am and CMakeLists.txt list the same sources
        run: python scripts/ci/check_build_parity.py

  cmake:
    name: CMake ${{ matrix.compiler }} ${{ matrix.build_type }} (strict, blocking)
    runs-on: ubuntu-latest
    # The exact GCC release comes from the official image; the runner image
    # only carries the distribution's GCC.  Clang comes from apt.llvm.org.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang, gcc-16, clang-22]
        include:
          # Oldest supported compilers: the runner image's distribution builds.
          - compiler: gcc
            cc: gcc
            preset: ci-gcc
            packages: gcc
            min_version: "13"
            container: ""
            db_host: 127.0.0.1
          - compiler: clang
            cc: clang
            preset: ci-clang
            packages: clang
            min_version: "18"
            container: ""
            db_host: 127.0.0.1
          # Current supported compilers, pinned; see the compiler policy in
          # docs/guides/SETUP_AND_BUILD_GUIDE.md for the update cadence.
          - compiler: gcc-16
            cc: gcc
            preset: ci-gcc
            packages: ""
            min_version: "16.2"
            container: gcc:16.2
            db_host: mariadb
          - compiler: clang-22
            cc: clang-22
            preset: ci-clang
            packages: ""
            min_version: "22.1.8"
            container: ""
            db_host: 127.0.0.1
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: "1"
      LUMINARI_TEST_MYSQL_HOST: ${{ matrix.db_host }}
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: "3306"
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
    steps:
      - name: Install container prerequisites
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo python3 git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        if: matrix.container == ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: ${{ matrix.packages }} mariadb-client pandoc
          cache-variant: ${{ matrix.compiler }}-${{ matrix.build_type }}

      - name: Install Clang 22
        if: matrix.compiler == 'clang-22'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 22

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc ${{ matrix.cc }} --min-version ${{ matrix.min_version }}

      - name: Configure (${{ matrix.preset }}, ${{ matrix.build_type }})
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Test
        run: ctest -j"$(nproc)" --preset ${{ matrix.preset }}

      - name: Install
        run: |
          cmake --install build/${{ matrix.preset }}
          test -x bin/luminari
          test -L bin/luminari

  warning-budget:
    name: Migration warning budget (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-16
            cc: gcc
            min_version: "16.2"
            container: gcc:16.2
          - compiler: clang-22
            cc: clang-22
            min_version: "22.1.8"
            container: ""
    steps:
      - name: Install container prerequisites
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo python3 git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-variant: budget-${{ matrix.compiler }}

      - name: Install Clang 22
        if: matrix.compiler == 'clang-22'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 22

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc ${{ matrix.cc }} --min-version ${{ matrix.min_version }}

      # The migration tier is never combined with -Werror; the budget file
      # under scripts/ci/ is the gate and may only shrink.  Output sync keeps
      # parallel diagnostics from interleaving, which would change the count.
      - name: Build with the migration warning tier
        run: |
          cmake -S . -B build/budget \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLUMINARI_WARNING_TIER=migration \
            -DBUILD_TESTS=ON
          cmake --build build/budget -j"$(nproc)" -- --output-sync=target 2>&1 \
            | tee build/budget/build.log

      - name: Compare against the budget
        run: >-
          python3 scripts/ci/check_warning_budget.py
          --compiler ${{ matrix.compiler }} --log build/budget/build.log

  clean-archive:
    name: Clean archive (${{ matrix.build }}, blocking)
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: autotools
            skip: --skip-cmake
          - build: cmake
            skip: --skip-autotools
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: "1"
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: "3306"
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: ${{ github.workspace }}/.ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: mariadb-client mariadb-server pandoc ripgrep
          cache-variant: archive-${{ matrix.build }}

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc gcc --min-version 13

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Build, test, and install git archive HEAD through Autotools and CMake
        run: scripts/ci/check_clean_archive.sh ${{ matrix.skip }}

  unit-tests:
    name: Production-linked tests (both I/O drivers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: "1"
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: "3306"
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
      LUMINARI_IO_DRIVER: libevent
      TERRAIN_API_PORT: "4182"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: mariadb-client mariadb-server pandoc ripgrep curl netcat-openbsd
          cache-variant: autotools-gcc

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc gcc --min-version 13

      # Strict flags must not change any feature-test result; this also
      # leaves the tree plainly configured.
      - name: Check feature probes ignore strict flags
        run: scripts/ci/check_configure_probes.sh --cc gcc

      - name: Configure with autotools (strict)
        run: ./configure --enable-werror

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Run the authoritative test entry point
        run: |
          make -j"$(nproc)" test-all
          test -x bin/luminari
          test -L bin/luminari
          test ! -e luminari
          test ! -e circle

      - name: Run the same binary with the select driver
        run: LUMINARI_IO_DRIVER=select ./cutest

      - name: Server startup smoke test
        run: scripts/ci/test_server_startup.sh

      # A clean checkout must still be clean after configure, build, test,
      # install, and clean: every generated output has to be ignored.
      - name: Check the working tree stays clean
        run: |
          make clean
          leftovers="$(git status --porcelain --untracked-files=all)"
          if [ -n "$leftovers" ]; then
            echo "::error::Build cycle left unignored files in the working tree:"
            echo "$leftovers"
            exit 1
          fi
          echo "Working tree clean after build/test/install/clean"

      # The source distribution must carry source and data only.
      - name: Check the source distribution
        run: |
          make dist
          mkdir -p .dist-check
          tar -xzf luminarimud-*.tar.gz -C .dist-check
          python3 scripts/ci/check_source_hygiene.py --root .dist-check/luminarimud-*
          echo "Source distribution hygiene passed"

  production-profile:
    name: Production profile (${{ matrix.build }}, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [autotools, cmake]
        cc: [gcc, clang]
        include:
          # GCC 14 is the newest GCC on the runner image; it proves the explicit
          # hardening set on a compiler generation CI would otherwise never see.
          - build: autotools
            cc: gcc-14
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CC: ${{ matrix.cc }}
      LUMINARI_TEST_MYSQL_ENABLE: "1"
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: "3306"
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: clang gcc-14 mariadb-client mariadb-server pandoc ripgrep
          cache-variant: production-${{ matrix.build }}-${{ matrix.cc }}

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc ${{ matrix.cc }}

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Build, verify, and test the hardened artifact (autotools)
        if: matrix.build == 'autotools'
        run: |
          autoreconf -fvi
          # The retired no-op profile option must be rejected, not warned about.
          if ./configure --enable-optimizations >configure-unknown.log 2>&1; then
            cat configure-unknown.log
            echo "configure accepted an unknown option" >&2
            exit 1
          fi
          grep -q 'unrecognized options: --enable-optimizations' configure-unknown.log
          # The profile must be the last word over a caller's CFLAGS/LDFLAGS.
          ./configure --enable-production CFLAGS='-O1 -D_FORTIFY_SOURCE=2' LDFLAGS='-Wl,-z,lazy' \
            >configure-override.log 2>&1
          grep -Eq '^CFLAGS = -O1 -D_FORTIFY_SOURCE=2 .*-D_FORTIFY_SOURCE=3' Makefile
          grep -Eq '^LDFLAGS = -Wl,-z,lazy .*-Wl,-z,now' Makefile
          ./configure --enable-production
          make -j"$(nproc)"
          scripts/deployment/verify_hardened_binary.sh ./luminari
          if [[ "${{ matrix.cc }}" == gcc-14 ]]; then
            make -j"$(nproc)" test
          fi
          make install
          scripts/deployment/verify_hardened_binary.sh bin/luminari
          test -L bin/luminari
          test ! -e luminari

      - name: Build, verify, and test the hardened artifact (cmake)
        if: matrix.build == 'cmake'
        run: |
          tests=OFF
          [[ "${{ matrix.cc }}" != clang ]] || tests=ON
          cmake -S . -B build -DLUMINARI_PRODUCTION=ON -DBUILD_TESTS="$tests"
          cmake --build build -j"$(nproc)"
          scripts/deployment/verify_hardened_binary.sh build/bin/luminari
          if [[ "$tests" == ON ]]; then
            scripts/deployment/verify_hardened_binary.sh build/cutest
            ctest -j"$(nproc)" --test-dir build --output-on-failure
          fi
          cmake --install build
          scripts/deployment/verify_hardened_binary.sh bin/luminari

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both supported compiler families build the instrumented suite; the
          # check_sanitizer_build.sh step proves which one did and that the
          # runtime is linked, so installing Clang can never leave a GCC build.
          - name: ASan+UBSan (gcc)
            cc: gcc
            min_version: "13"
            sanitizers: address,undefined
            variant: asan-ubsan
          - name: ASan+UBSan (clang)
            cc: clang
            min_version: "18"
            sanitizers: address,undefined
            variant: asan-ubsan
          # ThreadSanitizer over the same production-linked suite, boot, and
          # client smoke: the AI worker, the Intermud3 client thread, logging,
          # and the database handoff all run here.
          - name: ThreadSanitizer (clang)
            cc: clang
            min_version: "18"
            sanitizers: thread
            variant: tsan
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CC: ${{ matrix.cc }}
      LUMINARI_TEST_MYSQL_ENABLE: "1"
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: "3306"
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
      LUMINARI_STARTUP_TIMEOUT: "180"
      LUMINARI_STARTUP_LOG_DIR: ${{ github.workspace }}/sanitizer-logs
      TERRAIN_API_PORT: "4182"
      # Every finding stops the run; no sanitizer is allowed a suppression file.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: clang mariadb-client mariadb-server pandoc ripgrep curl netcat-openbsd
          cache-variant: sanitizers-${{ matrix.cc }}-${{ matrix.variant }}

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc ${{ matrix.cc }} --min-version ${{ matrix.min_version }}

      # ThreadSanitizer's shadow layout needs at most 28 bits of mmap
      # randomization; the runner kernel defaults to 32, and TSan then
      # re-executes itself without ASLR, which a seccomp policy may refuse.
      - name: Lower ASLR entropy for ThreadSanitizer
        if: matrix.sanitizers == 'thread'
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28 ||
            echo "vm.mmap_rnd_bits is not adjustable here; TSan re-executes without ASLR"

      - name: Configure sanitizer build
        run: |
          autoreconf -fvi
          ./configure \
            CFLAGS='-O1 -g -fsanitize=${{ matrix.sanitizers }} -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=${{ matrix.sanitizers }}'

      - name: Build the suite and the server
        run: make -j"$(nproc)" cutest luminari

      - name: Verify the compiler, flags, and linked sanitizer runtimes
        run: >-
          scripts/ci/check_sanitizer_build.sh --cc ${{ matrix.cc }}
          --sanitizers ${{ matrix.sanitizers }} --binary cutest --binary luminari

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      # The syntax-check boot runs here too: the encounter world loads inside
      # the instrumented process instead of being skipped.
      - name: Run the production-linked suite with the syntax boot
        run: LUMINARI_TEST_ROOT="$PWD" ./cutest

      - name: Install the instrumented server
        run: |
          make install
          test -x bin/luminari

      - name: Boot, pre-authentication client interaction, and shutdown
        run: scripts/ci/test_server_startup.sh

      - name: Upload sanitizer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs-${{ matrix.cc }}-${{ matrix.variant }}
          path: sanitizer-logs
          if-no-files-found: ignore

  fuzz:
    name: Fuzz the trust boundaries (libFuzzer, ASan, UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: clang
          cache-variant: fuzz-clang

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc clang --min-version 18

      # fuzzer-no-link instruments every production object for coverage
      # guidance; luminari_fuzz links the cutest objects with libFuzzer's
      # driver, so the parsers under test are the ones the server compiles.
      - name: Configure the fuzzing build
        run: |
          autoreconf -fvi
          ./configure \
            CFLAGS='-O1 -g -fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined'

      - name: Build the production-linked fuzz harness
        run: make -j"$(nproc)" luminari_fuzz

      - name: Verify the linked sanitizer and fuzzer runtimes
        run: >-
          scripts/ci/check_sanitizer_build.sh --cc clang
          --sanitizers fuzzer-no-link,address,undefined --binary luminari_fuzz

      - name: Replay every seed and regression input
        run: scripts/ci/run_fuzz_targets.sh --seconds 0 --artifacts fuzz-artifacts

      - name: Run each trust-boundary target for 15 seconds
        run: scripts/ci/run_fuzz_targets.sh --seconds 15 --artifacts fuzz-artifacts

      - name: Run bounded protocol parser fuzzing
        run: make -C unittests/CuTest protocol-fuzz FUZZ_SECONDS=15

      - name: Run bounded binary file format fuzzing
        run: make -C unittests/CuTest binary-formats-fuzz FUZZ_SECONDS=15

      - name: Upload reproducers and fuzzer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts
          if-no-files-found: ignore

  # The durable binary file golden fixtures must decode and encode identically
  # on every supported architecture; x86-64 runs them inside the suites above.
  binary-formats-aarch64:
    name: Binary file formats (AArch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the golden fixture harness
        run: make -C unittests/CuTest binary-formats

  memory-check:
    name: Memory check
    runs-on: ubuntu-latest
    env:
      LUMINARI_TEST_SKIP_SYNTAX_BOOT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: valgrind
          cache-variant: valgrind

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc gcc --min-version 13

      - name: Configure and build test binary
        run: |
          autoreconf -fvi
          ./configure
          make -j"$(nproc)" cutest

      - name: Run Valgrind on production-linked tests
        run: |
          LUMINARI_TEST_ROOT="$PWD" valgrind \
            --leak-check=full \
            --show-leak-kinds=definite \
            --errors-for-leak-kinds=definite \
            --track-origins=yes \
            --error-exitcode=1 \
            ./cutest

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: "1"
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: "3306"
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # HEAD^1 is the base for changed-line coverage: the target branch for a
          # pull request's merge commit, the previous tip for a push.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          packages: mariadb-client
          cache-variant: coverage

      - name: Verify the compiler
        run: scripts/ci/check_compiler.sh --cc gcc --min-version 13

      - name: Install coverage tool
        run: python -m pip install 'gcovr==8.6'

      - name: Configure coverage build
        run: |
          autoreconf -fvi
          ./configure CFLAGS='--coverage -O0 -g' LDFLAGS='--coverage'

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      # The world registries and the domain-event bus hash entity addresses, so
      # which collision paths run depends on where objects land. Without address
      # randomization, and with the environment padded to one size (it sits at
      # the top of the stack), a rerun of this commit lays out memory the same
      # way and measures the same totals.
      - name: Run production-linked tests against MariaDB
        run: |
          make -j"$(nproc)" cutest
          padding=$((65536 - $(env | wc -c)))
          COVERAGE_ENV_PADDING=$(head -c "$padding" /dev/zero | tr '\0' x) \
            setarch "$(uname -m)" --addr-no-randomize ./cutest

      - name: Run covered protocol parser harness
        run: |
          make -C unittests/CuTest protocol-parser \
            PROTOCOL_TEST_CFLAGS='-Wall -Wextra -std=gnu2x -g -O0 --coverage -ffunction-sections -fdata-sections' \
            PROTOCOL_TEST_LDFLAGS='-lm -ljson-c -Wl,--gc-sections --coverage'

      # Only src/ is measured. The test sources, the vendored CuTest harness,
      # and generated files (AllTests.c, build_identity.h, conf.h) are all
      # outside it, and no file under src/ is excluded; check_coverage.py fails
      # on any report path that is not a normalized path under src/.
      - name: Generate coverage reports
        run: |
          gcovr \
            --root . \
            --filter '^src/' \
            --print-summary \
            --xml coverage.xml \
            --xml-pretty \
            --html-details coverage.html \
            --json-summary coverage-summary.json \
            --json-summary-pretty \
            src unittests/CuTest/build

      # Repository, critical-subsystem, and changed-line floors from
      # scripts/ci/coverage_policy.json. The suite runs with its default seed, so
      # a rerun at the same commit measures the same totals.
      - name: Enforce the coverage policy
        run: |
          set -o pipefail
          args=(--report coverage.xml)
          if git rev-parse -q --verify 'HEAD^1' >/dev/null; then
            args+=(--base 'HEAD^1')
          fi
          python3 scripts/ci/check_coverage.py "${args[@]}" 2>&1 | tee coverage-policy.txt

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.*.html
            coverage*.css
            coverage*.js
            coverage.xml
            coverage-summary.json
            coverage-policy.txt
