name: Build & Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'unittests/**'
      - 'scripts/world/**'
      - 'scripts/ci/**'
      - 'scripts/deployment/**'
      - 'scripts/operations/**'
      - 'scripts/development/generate-web-guides.sh'
      - 'scripts/events/**'
      - 'lib/world/validate-zone.sh'
      - 'lib/world/artifacts/**'
      - 'lib/world/minimal/**'
      - 'docs/world_game-data/**'
      - 'docs/world/STARTER_AREA.md'
      - 'docs/systems/OLC_ONLINE_CREATION_SYSTEM.md'
      - 'docs/guides/OLC_SpecProcs.md'
      - 'docs/guides/TESTING_GUIDE.md'
      - 'docs/utilities/**'
      - 'docs/TECHNICAL_DOCUMENTATION_MASTER_INDEX.md'
      - 'docs/web/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'util/Makefile.am'
      - '.gitignore'
      - 'scripts/ci/check_source_hygiene.py'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'unittests/**'
      - 'scripts/world/**'
      - 'scripts/ci/**'
      - 'scripts/deployment/**'
      - 'scripts/operations/**'
      - 'scripts/development/generate-web-guides.sh'
      - 'scripts/events/**'
      - 'lib/world/validate-zone.sh'
      - 'lib/world/artifacts/**'
      - 'lib/world/minimal/**'
      - 'docs/world_game-data/**'
      - 'docs/world/STARTER_AREA.md'
      - 'docs/systems/OLC_ONLINE_CREATION_SYSTEM.md'
      - 'docs/guides/OLC_SpecProcs.md'
      - 'docs/guides/TESTING_GUIDE.md'
      - 'docs/utilities/**'
      - 'docs/TECHNICAL_DOCUMENTATION_MASTER_INDEX.md'
      - 'docs/web/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'util/Makefile.am'
      - '.gitignore'
      - 'scripts/ci/check_source_hygiene.py'
      - '.github/workflows/test.yml'

permissions:
  contents: read

env:
  LUMINARI_TEST_SPEC_WORLD_ROOT: ${{ github.workspace }}/unittests/CuTest/fixtures/spec_world_inventory

jobs:
  world-tools:
    name: World-data tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install documentation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libevent-dev pandoc

      - name: Build mobile conversion calculator
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h
          autoreconf -fvi
          ./configure
          make -C util rol_mob_calculator

      - name: Run world-data tool tests
        run: python -m unittest discover -s scripts/world/tests -t scripts/world -v

      - name: Check extracted constants
        run: python scripts/world/wtool.py constants sync --check

      - name: Check world-building documentation
        run: python scripts/world/wtool.py docs --check

      - name: Smoke test compatibility wrapper
        run: |
          lib/world/validate-zone.sh 100 \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            --json >/dev/null

      - name: Smoke test quest-system lookup
        run: |
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            show quest 10000 >/dev/null
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            refs quest 10000 >/dev/null
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            show hlquest 10000 >/dev/null
          python scripts/world/wtool.py \
            --world-root scripts/world/tests/fixtures/phase2/complete \
            refs hlquest 10000 >/dev/null

  build-parity:
    name: Autotools/CMake manifest parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check that Makefile.am and CMakeLists.txt list the same sources
        run: python scripts/ci/check_build_parity.py

  cmake:
    name: CMake ${{ matrix.compiler }} (strict, blocking)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            preset: ci-gcc
            packages: gcc
          - compiler: clang
            preset: ci-clang
            packages: clang
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: '1'
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: '3306'
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.packages }} cmake pkg-config libcurl4-openssl-dev libevent-dev \
            libgd-dev libjson-c-dev libmariadb-dev libssl-dev mariadb-client pandoc zlib1g-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Install
        run: |
          cmake --install build/${{ matrix.preset }}
          test -x bin/luminari
          test -L bin/luminari

  clean-archive:
    name: Clean archive, both build systems (blocking)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: '1'
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: '3306'
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: ${{ github.workspace }}/.ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake libcurl4-openssl-dev libevent-dev \
            libgd-dev libjson-c-dev libmariadb-dev libssl-dev libtool mariadb-client \
            pandoc pkg-config ripgrep zlib1g-dev

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Build, test, and install git archive HEAD through Autotools and CMake
        run: scripts/ci/check_clean_archive.sh

  build:
    name: Behavioral tests (Luminari)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: '1'
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: '3306'
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libcurl4-openssl-dev libevent-dev libgd-dev \
            libjson-c-dev libmariadb-dev libssl-dev libtool mariadb-client zlib1g-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Configure with autotools
        run: |
          autoreconf -fvi
          ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Run production-linked behavioral tests
        run: |
          make test
          make install
          test -x bin/luminari
          test -L bin/luminari
          test ! -e luminari
          test ! -e circle

      # A clean checkout must still be clean after configure, build, test,
      # install, and clean: every generated output has to be ignored.
      - name: Check the working tree stays clean
        run: |
          make clean
          leftovers="$(git status --porcelain --untracked-files=all)"
          if [ -n "$leftovers" ]; then
            echo "::error::Build cycle left unignored files in the working tree:"
            echo "$leftovers"
            exit 1
          fi

      # The source distribution must carry source and data only.
      - name: Check the source distribution
        run: |
          make dist
          mkdir -p .dist-check
          tar -xzf luminarimud-*.tar.gz -C .dist-check
          python3 scripts/ci/check_source_hygiene.py --root .dist-check/luminarimud-*

  unit-tests:
    name: Production-linked tests (${{ matrix.io-driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        io-driver: [libevent, select]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: '1'
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: '3306'
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
      LUMINARI_IO_DRIVER: ${{ matrix.io-driver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libcurl4-openssl-dev libevent-dev libgd-dev \
            libjson-c-dev libmariadb-dev libssl-dev libtool mariadb-client \
            mariadb-server pandoc ripgrep zlib1g-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Configure with autotools
        run: |
          autoreconf -fvi
          ./configure

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Run the authoritative test entry point
        run: make test-all

  production-profile:
    name: Production profile (${{ matrix.build }}, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [autotools, cmake]
        cc: [gcc, clang]
        include:
          # GCC 14 is the newest GCC on the runner image; it proves the explicit
          # hardening set on a compiler generation CI would otherwise never see.
          - build: autotools
            cc: gcc-14
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CC: ${{ matrix.cc }}
      LUMINARI_TEST_MYSQL_ENABLE: '1'
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: '3306'
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang cmake gcc-14 libcurl4-openssl-dev \
            libevent-dev libgd-dev libjson-c-dev libmariadb-dev libssl-dev libtool \
            mariadb-client pandoc ripgrep zlib1g-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Build, verify, and test the hardened artifact (autotools)
        if: matrix.build == 'autotools'
        run: |
          autoreconf -fvi
          # The retired no-op profile option must be rejected, not warned about.
          if ./configure --enable-optimizations >configure-unknown.log 2>&1; then
            cat configure-unknown.log
            echo "configure accepted an unknown option" >&2
            exit 1
          fi
          grep -q 'unrecognized options: --enable-optimizations' configure-unknown.log
          # The profile must be the last word over a caller's CFLAGS/LDFLAGS.
          ./configure --enable-production CFLAGS='-O1 -D_FORTIFY_SOURCE=2' LDFLAGS='-Wl,-z,lazy' \
            >configure-override.log 2>&1
          grep -Eq '^CFLAGS = -O1 -D_FORTIFY_SOURCE=2 .*-D_FORTIFY_SOURCE=3' Makefile
          grep -Eq '^LDFLAGS = -Wl,-z,lazy .*-Wl,-z,now' Makefile
          ./configure --enable-production
          make -j"$(nproc)"
          scripts/deployment/verify_hardened_binary.sh ./luminari
          make test
          make install
          scripts/deployment/verify_hardened_binary.sh bin/luminari
          test -L bin/luminari
          test ! -e luminari

      - name: Build, verify, and test the hardened artifact (cmake)
        if: matrix.build == 'cmake'
        run: |
          cmake -S . -B build -DLUMINARI_PRODUCTION=ON -DBUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
          scripts/deployment/verify_hardened_binary.sh build/bin/luminari
          scripts/deployment/verify_hardened_binary.sh build/cutest
          ctest --test-dir build --output-on-failure
          cmake --install build
          scripts/deployment/verify_hardened_binary.sh bin/luminari

  sanitizers:
    name: ASan, UBSan, and protocol fuzzing
    runs-on: ubuntu-latest
    env:
      LUMINARI_TEST_SKIP_SYNTAX_BOOT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang libcurl4-openssl-dev libevent-dev \
            libgd-dev libjson-c-dev libmariadb-dev libssl-dev libtool zlib1g-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Configure sanitizer build
        run: |
          autoreconf -fvi
          ./configure \
            CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined'

      - name: Run production-linked sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          make -j"$(nproc)" cutest
          LUMINARI_TEST_ROOT="$PWD" ./cutest

      - name: Run bounded protocol parser fuzzing
        run: make -C unittests/CuTest protocol-fuzz FUZZ_SECONDS=15

  memory-check:
    name: Memory check
    runs-on: ubuntu-latest
    env:
      LUMINARI_TEST_SKIP_SYNTAX_BOOT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libcurl4-openssl-dev libevent-dev libgd-dev \
            libjson-c-dev libmariadb-dev libssl-dev libtool valgrind zlib1g-dev

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Configure and build test binary
        run: |
          autoreconf -fvi
          ./configure
          make -j"$(nproc)" cutest

      - name: Run Valgrind on production-linked tests
        run: |
          LUMINARI_TEST_ROOT="$PWD" valgrind \
            --leak-check=full \
            --show-leak-kinds=definite \
            --errors-for-leak-kinds=definite \
            --track-origins=yes \
            --error-exitcode=1 \
            ./cutest

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: luminari_test
          MARIADB_USER: luminari_test
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUMINARI_TEST_MYSQL_ENABLE: '1'
      LUMINARI_TEST_MYSQL_HOST: 127.0.0.1
      LUMINARI_TEST_MYSQL_USER: luminari_test
      LUMINARI_TEST_MYSQL_PASSWORD: test_password
      LUMINARI_TEST_MYSQL_DATABASE: luminari_test
      LUMINARI_TEST_MYSQL_PORT: '3306'
      LUMINARI_TEST_DATA_DIR: ${{ github.workspace }}/.ci-runtime/lib
      LUMINARI_TEST_CONFIG_FILE: .ci-runtime/lib/etc/config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libcurl4-openssl-dev libevent-dev \
            libgd-dev libjson-c-dev libmariadb-dev libssl-dev libtool mariadb-client zlib1g-dev

      - name: Install coverage tool
        run: python -m pip install 'gcovr==8.6'

      - name: Copy config headers
        run: |
          cp src/campaign.example.h src/campaign.h
          cp src/mud_options.example.h src/mud_options.h
          cp src/vnums.example.h src/vnums.h

      - name: Configure coverage build
        run: |
          autoreconf -fvi
          ./configure CFLAGS='--coverage -O0 -g' LDFLAGS='--coverage'

      - name: Prepare isolated test runtime
        run: scripts/ci/prepare_test_runtime.sh "$LUMINARI_TEST_DATA_DIR"

      - name: Run production-linked tests against MariaDB
        run: |
          make -j"$(nproc)" cutest
          ./cutest

      - name: Run covered protocol parser harness
        run: |
          make -C unittests/CuTest protocol-parser \
            PROTOCOL_TEST_CFLAGS='-Wall -Wextra -std=gnu2x -g -O0 --coverage -ffunction-sections -fdata-sections' \
            PROTOCOL_TEST_LDFLAGS='-lm -ljson-c -Wl,--gc-sections --coverage'

      - name: Generate coverage report and enforce baseline
        run: |
          # Measured with the full Luminari CI suite and gcovr 8.6:
          # Stable floors from repeated CI measurements: 10.50% lines and
          # 7.16% branches. Counts vary slightly in randomized game tests.
          # Raise both fixed floors whenever the measured result increases.
          gcovr \
            --root . \
            --filter '^src/' \
            --print-summary \
            --xml coverage.xml \
            --xml-pretty \
            --html-details coverage.html \
            --json-summary coverage-summary.json \
            --json-summary-pretty \
            --fail-under-line 10.50 \
            --fail-under-branch 7.16 \
            src unittests/CuTest/build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.*.html
            coverage*.css
            coverage.xml
            coverage-summary.json
